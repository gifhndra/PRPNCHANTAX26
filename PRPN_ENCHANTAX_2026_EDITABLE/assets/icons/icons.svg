    <path d="M13 4l8 8-8 8"/>
  </symbol>

  <!-- Masuk ke Kerajaan / Royal Seal -->
  <symbol id="icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
