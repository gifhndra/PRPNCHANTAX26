<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Portal / Kerajaan -->
  <symbol id="icon-portal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 21h18"/>
    <path d="M5 21V9a7 7 0 0 1 14 0v12"/>
    <path d="M9 21v-7a3 3 0 0 1 6 0v7"/>
    <path d="M12 3v3"/>
    <circle cx="12" cy="7" r="1" fill="currentColor"/>
