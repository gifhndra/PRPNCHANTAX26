  <symbol id="icon-crow" viewBox="0 0 64 64" fill="currentColor" stroke="#e29a3f" stroke-width="1" stroke-linejoin="round" paint-order="stroke fill">
    <path d="M12 28 C16 22 24 16 34 16 C38 16 42 18 46 22 C52 20 58 22 62 26 C60 28 56 29 53 29 C52 33 48 37 42 39 C36 41 30 43 24 47 C18 51 14 56 10 60 C11 54 13 48 16 43 C12 43 8 41 6 38 C4 35 6 32 10 30 Z M46 24 C47 24 48 23 48 22 C48 21 47 20 46 20 C45 20 44 21 44 22 C44 23 45 24 46 24 Z"/>
  </symbol>

  <!-- Ikon Tahap 2 (#pg-portal): Monokrom bergaris seragam -->
  <symbol id="icon-lcc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
